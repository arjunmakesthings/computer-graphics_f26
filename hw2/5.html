<!-- light up & down:  -->

<body bgcolor="black">
  <canvas id="canvas" width="800" height="800"></canvas>
  <script src="../assets/webgl.js"></script>
  <script>
    //define spheres:
    let sp = [];
    const r = 0.04;

    for (let x = -1.0 + r; x < 1.0 - r; x += r * 2.) {
      for (let y = -1.0 + r; y < 1.0 - r; y += r * 2.) {
        sp.push(x, y, -3.0, r);
      }
    }

    const sp_length = sp.length / 4;

    function Scene() {
      this.vertex_shader = `#version 300 es
         in  vec3 a_pos;
         out vec3 v_pos;
         void main() {
            gl_Position = vec4(a_pos, 1.);
            v_pos = a_pos;
         }`;

      this.fragment_shader =
        `#version 300 es
         precision highp float;
         in  vec3 v_pos;
         out vec4 frag_col;

         uniform float u_time;

         //take spheres: 
         uniform vec4 u_spheres[` +
        sp_length +
        `];

         //focal length:

         float f = 3.; 

         vec4 s = vec4(0.0, 0.0, -3.0, 0.75); 

         //tracing a ray to a sphere: 
         float ray_to_sphere(vec3 v, vec3 w, vec4 s){
          v -= s.xyz; //position of camera relative to sphere. 
          float r = s.w; 

          //need dot products for the equation (W•W) t2 + 2 (W•V) t + (V•V) - r2 = 0. 
          //w is a unit length vector. 
          float vw = dot(v,w); 
          float vv = dot(v,v); //length of itself. 
          
          float d = vw * vw - (vv - r*r); 

          if (d < 0.){
            return -1.0;
          }else{
            //hit the circle. :
            return -vw - sqrt(d);
          }
         }

         void main() {
          vec3 pos = v_pos; 
          frag_col = vec4(vec3(0.0), 1.0);

          //ray from camera to this pixel: 
          vec3 v = vec3(0.0, 0.0, 0.); //cam position. 
          vec3 w = normalize(vec3(v_pos.xy, -f)); 

          for (int i = 0; i < ` + sp_length + `; i++) {
            float t = ray_to_sphere(v, w, u_spheres[i]); 

            if (t >= 0.0){
              frag_col = vec4(1.0); 

              //find the point on the sphere's surface: 
              vec3 p = v + t * w; 

              //surface normal: 
              vec3 n = normalize(p - u_spheres[i].xyz); 

              vec3 light = vec3(-1.0, 0.0, -3.0); 
              float d = length(u_spheres[i].xyz - light);
              vec3 c = vec3(0.8 + (sin(u_time) - d + 0.8), 0.0,0.0); 
              frag_col = vec4(sqrt(c), 1.);
            }
          }
         }`;

      let start_time = Date.now() / 1000;

      this.update = () => {
        let t = Date.now() / 1000 - start_time;
        //   console.log(t % 1);
        set_uniform("1f", "u_time", t);

        //sphere manipulation:

        set_uniform("4fv", "u_spheres", sp);
      };
    }
    gl_start(canvas, new Scene());
  </script>
</body>
