  <body bgcolor="black">
    <!--<canvas id="canvas" width="800" height="800"></canvas>-->
    <canvas id="canvas"></canvas>

    <!-- for debug: -->
    <style>
      canvas {
        border: 1px solid white;
        margin: 0; 
        padding: 0; 
        width: 99vw;
        height: 99vh;
        overflow: hidden;
      }
    </style>

    <!-- scripts: -->
    <script src="../assets/webgl-3.1.js"></script>
    <script src="../assets/library-1.3.js"></script>
    <script src="../assets/shapes.js"></script>
    <script src="../assets/materials.js"></script>
    <script src="../assets/noise.js"></script>
    
    <!-- webgl: -->
    <script>
      let checker = true;
      function Scene() {

        //to make a scene now, we simply define a vertex map (where each thing is, and its size):
        this.vertex_size = 6;
        this.vertex_attributes = {
          a_pos: { size: 3, position: 0 },
          a_nor: { size: 3, position: 3 },
        };
  
        this.vertex_shader = `#version 300 es
        uniform mat4 u_mf, u_mi;
        in vec3 a_pos, a_nor;
        out vec3 v_pos, v_nor;
  
        void main(){
          vec4 pos = u_mf * vec4(a_pos, 1.);
          vec4 nor = vec4(a_nor, 0.) * u_mi;
          v_pos = pos.xyz / pos.w;
          v_pos.z *= -1.;
          v_nor = nor.xyz;
          gl_Position = vec4(v_pos, 1.);
        }`;
  
        this.fragment_shader = `#version 300 es
        precision highp float;
  
        in  vec3 v_pos, v_nor;
        out vec4 frag_col;
  
        uniform vec3 u_amb, u_diff; 
  
        uniform vec4 u_spec; 
  
        uniform float u_time; 
  
        void main() {
        vec3 l_dir = normalize(vec3(-1., -1., 1.)); 
        vec3 n = normalize(v_nor); 

        vec3 v = vec3(0., 0., 1.); 

        float sim = dot (n, l_dir); 
        vec3 ref = 2. * dot(n, l_dir) * n - l_dir; 

        vec3 light = u_amb + u_diff * max (0., sim) + u_spec.rgb * pow(max(0., dot(ref, v)), u_spec.w); 

        frag_col = vec4(sqrt(light), 1.); 
        }`;
  
        //define variables:
        let start_time = Date.now() / 1000;
        let m = new Matrix(); 
  
        //define shapes to be used: 
        let shp = make_sphere(20); 
  
        this.update = () => {
          //resize to active canvas:
          canvas.width = canvas.clientWidth; 
          canvas.height = canvas.clientHeight; 
          gl.viewport(0, 0, canvas.width, canvas.height);

          let t = Date.now() / 1000 - start_time;
          set_uniform("1f", "u_time", t);
  
          //global transforms:
          m.identity();
          m.scale(canvas.height / canvas.width, 1, 1);
          //isometric rotation:
          m.rotate_x(Math.atan(1 / Math.sqrt(2)));
          m.rotate_y(Math.PI  / 4);
          m.perspective(45); 

          //wrist: 
          let x = map(Math.cos(t), -1, 1, 0.5, 0.8); 
          let y = map(Math.sin(t), -1, 1, -0.2, 0.2);

          //length of first limb: 
          let a = 0.2;
          //length of second limb: 
          let b = 0.2;
          //position of wrist:
          let C = [x, y, 0]; 
          //direction of elbow
          let D = [0., 1, 0]; 

          //returns a 3-d position of the elbow.
          let elbow = ik(a,b,C,D); 

          const w = 0.2; 
          const h = 0.03; 
          const d = h;

          //shoulder:
          const base_x = -0.9; 
          m.move(base_x + w, 0. ,0); 

          m.push(); 
            m.move(elbow[0] + 2 * a, elbow[1], elbow[2]);
            m.scale(w, h, d);
            draw(shp, Material.red_plastic, m); 
          m.pop(); 

          m.push(); 
            m.move(w*2, 0., 0.);
            m.move(x,y,0);  
            m.scale(w,h,d); 
            draw(shp, Material.blue_plastic, m); 
          m.pop(); 

          //origin point:
          //or shoulder: 
          //m.move(-1, 0., 0.); 

          ////upper-arm: 
          //m.push(); 
          //  m.rotate_z(Math.atan2(elbow[1], elbow[0]));
          //  m.move(a / 2, 0., 0.); 
          //  m.scale(a/2, h, d); 
          //  draw(shp, Material.red_plastic, m); 
          //m.pop();
          
          //m.push();
          //  m.move(elbow[0], elbow[1], elbow[2]);
          //  m.rotate_z(Math.atan2(y - elbow[1], x - elbow[0]));
          //  m.move(b / 2, 0., 0.);
          //  m.scale(b / 2, h, d);
          //  draw(shp, Material.blue_plastic, m);
          //m.pop();
          };
      }
  
      gl_start(canvas, new Scene());
  
      //since i have frag in a different file:
      //let scene = new Scene();
      //fetch('./frag.frag').then(r => r.text()).then(src => {
      //  scene.fragment_shader = src;
      //  gl_start(canvas, scene);
      //});
  
    </script>
  
  </body>
