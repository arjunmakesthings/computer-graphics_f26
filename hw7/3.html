<body bgcolor="black">
  <canvas id="canvas" width="800" height="800"></canvas>

  <!-- for debug: -->
  <style>
    canvas{
      border: 1px solid white;
    }
  </style>

  <!-- scripts: -->
  <script src="../assets/webgl-3.1.js"></script>
  <script src="../assets/library-1.2.js"></script>
  <script src="../assets/shapes.js"></script>
  <script src="../assets/materials.js"></script>
  <script src="../assets/noise.js"></script>

  <!-- webgl: -->
  <script>
    let checker = true;
    function Scene() {
      //to make a scene now, we simply define a vertex map (where each thing is, and its size):
      this.vertex_size = 6;
      this.vertex_attributes = {
        a_pos: { size: 3, position: 0 },
        a_nor: { size: 3, position: 3 },
      };

      this.vertex_shader = `#version 300 es
      uniform mat4 u_mf, u_mi;
      in vec3 a_pos, a_nor;
      out vec3 v_pos, v_nor;

      void main(){
        vec4 pos = u_mf * vec4(a_pos, 1.);
        vec4 nor = vec4(a_nor, 0.) * u_mi;
        v_pos = pos.xyz / pos.w;
        v_pos.z *= -1.;
        v_nor = nor.xyz;
        gl_Position = vec4(v_pos, 1.);
      }`;

      this.fragment_shader = `#version 300 es
      precision highp float;

      in  vec3 v_pos, v_nor;
      out vec4 frag_col;

      uniform vec3 u_amb, u_diff; 

      uniform vec4 u_spec; 

      uniform float u_time; 

      void main() {
        vec3 l_dir = normalize(vec3(0., 1., 0.)); 
        //vec3 l_dir = normalize(vec3(v_pos)); 
        //vec3 l_dir = normalize(vec3(v_pos)); 
        //vec3 l_dir = normalize(vec3(v_pos)); 
        //vec3 l_dir = vec3(0.); 
        
        float r = 0.2; 
        float t = 0.5; 

        vec3 in_nor = v_nor; 
        in_nor.x = r * (t - sin(t)); 
        in_nor.y = r * (1. - cos(t));

        vec3 n = normalize(in_nor); 

        vec3 v = vec3(0., 0., 1.); 

        float sim = dot (n, l_dir); 
        vec3 ref = 2. * dot(n, l_dir) * n - l_dir; 

        vec3 light = u_amb + u_diff * max (0., sim) + u_spec.rgb * pow(max(0., dot(ref, v)), u_spec.w); 

        float freq  = 23.; //size; bigger: smaller.
        float speed = .3; //speed.
        float amp   = 1.; //strength.

        float ns = noise(v_pos * freq + vec3(0., u_time * speed, 0.));

        //float ns = noise(v_pos + (mod(u_time, 10.) * 0.1)); 

        //light += ns; 

        frag_col = vec4(sqrt(light), 1.); 
      }`;

      //define variables:
      let start_time = Date.now() / 1000;
      let m = new Matrix(); 

      //define shapes to be used: 
      let shp = make_sphere(); 

      this.update = () => {
        let t = Date.now() / 1000 - start_time;
        set_uniform("1f", "u_time", t);

        //global transforms:
        m.identity();
        m.perspective(10);

        const bl = 0.1; 
        const bw = 0.1;

        let s = Math.sin(t); 
        let c = Math.cos(t); 

        //origin move:
        //m.move(0., -1. + bl + (bl * 0.2) ,0.); 
        //m.move(0., -0.5, 0.)

        const ceil = 0.1; 
        //m.rotate_x(Math.PI / ceil + ceil * s)
        //m.rotate_y(Math.PI / ceil + ceil * c)
        //m.rotate_z(Math.PI / ceil + ceil * c)
        //m.rotate_y(t * 0.5); 

        //constants for l-system:
        let angle_dev = 0.2; //* Math.sin(t); 
        const scale_dev = 0.75;

        let branch = (angle, l, w, max_depth, id) => {
          if (max_depth < 0) return;

          let scaled_id = id * 1.7; 

          let sway = Math.sin(t + scaled_id); 

          sway*=0.2; 

            m.push();
              m.rotate_z(angle + sway);
              m.move(0., l, 0.); //move to the center of this branch.

                m.push(); //scale only drawing; not transformations.
                  m.scale(w, l, bw);
                  //let mat = Material.rand; 
                  m.move(0.,0.,noise.simplex2(id, 1 - id)); 
                  draw(shp, Material.blue_plastic, m);
                //  if (checker == true){
                //  console.log(mat); 
                //  checker = false;
                //}
                m.pop();

                //let z_displace = map(noise.simplex2(w + t * 0.2,l), -1.,1.,-0.005,0.005)
                let z_displace = 0.1; 

                //console.log(noise.simplex2(w,l)); 

              m.move(0., l, z_displace); //move to tip of the branch.
              m.rotate_x(l * Math.sin(t)); 
              branch(angle_dev, l * scale_dev, w * scale_dev, max_depth - 1, id + 1); //left:
              branch(-angle_dev, l * scale_dev, w * scale_dev, max_depth - 1, id + 2); //right.
            m.pop();
        };

      //base branch:
      branch(0., bl * 2.2, bw, 1, 0);
      }
    }

    gl_start(canvas, new Scene());

    //since i have frag in a different file:
    //let scene = new Scene();
    //fetch('./frag.frag').then(r => r.text()).then(src => {
    //  scene.fragment_shader = src;
    //  gl_start(canvas, scene);
    //});

  </script>
</body>
