      //helpers:

        return low2 + (high2 - low2) * (value - low1) / (high1 - low1);
      }

       n(),p(),p(),  0,p(),0,   p(),p(),n(),  0,p(),0,   n(),p(),n(),  0,p(),0,
       n(),p(),p(),  0,p(),0,   p(),p(),n(),  0,p(),0,   p(),p(),p(),  0,p(),0,
       n(),n(),p(),  0,n(),0,   p(),n(),n(),  0,n(),0,   n(),n(),n(),  0,n(),0,
       n(),n(),p(),  0,n(),0,   p(),n(),n(),  0,n(),0,   p(),n(),p(),  0,n(),0,

       n(),p(),p(),  0,0,p(),   p(),n(),p(),  0,0,p(),   n(),n(),p(),  0,0,p(),
       n(),p(),p(),  0,0,p(),   p(),n(),p(),  0,0,p(),   p(),p(),p(),  0,0,p(),

       n(),p(),n(),  0,0,n(),   p(),n(),n(),  0,0,n(),   p(),p(),n(),  0,0,n(),
       
       p(),n(),p(),  p(),0,0,   p(),p(),n(),  p(),0,0,   p(),n(),n(),  p(),0,0,
       p(),n(),p(),  p(),0,0,   p(),p(),n(),  p(),0,0,   p(),p(),p(),  p(),0,0,
       n(),n(),p(),  n(),0,0,   n(),p(),n(),  n(),0,0,   n(),n(),n(),  n(),0,0,
       n(),n(),p(),  n(),0,0,   n(),p(),n(),  n(),0,0,   n(),p(),p(),  n(),0,0,

       n(),p(),p(),  0,p(),0,   p(),p(),n(),  0,p(),0,   n(),p(),n(),  0,p(),0,
       n(),p(),p(),  0,p(),0,   p(),p(),n(),  0,p(),0,   p(),p(),p(),  0,p(),0,

       n(),n(),p(),  0,n(),0,   p(),n(),n(),  0,n(),0,   p(),n(),p(),  0,n(),0,

       n(),p(),p(),  0,0,p(),   p(),n(),p(),  0,0,p(),   n(),n(),p(),  0,0,p(),
       n(),p(),p(),  0,0,p(),   p(),n(),p(),  0,0,p(),   p(),p(),p(),  0,0,p(),
       n(),p(),n(),  0,0,n(),   p(),n(),n(),  0,0,n(),   n(),n(),n(),  0,0,n(),

       n(),p(),p(),  0,p(),0,   p(),p(),n(),  0,p(),0,   n(),p(),n(),  0,p(),0,
       n(),p(),p(),  0,p(),0,   p(),p(),n(),  0,p(),0,   p(),p(),p(),  0,p(),0,
       n(),n(),p(),  0,n(),0,   p(),n(),n(),  0,n(),0,   n(),n(),n(),  0,n(),0,

       p(),n(),p(),  p(),0,0,   p(),p(),n(),  p(),0,0,   p(),p(),p(),  p(),0,0,
       n(),n(),p(),  n(),0,0,   n(),p(),n(),  n(),0,0,   n(),n(),n(),  n(),0,0,
       n(),n(),p(),  n(),0,0,   n(),p(),n(),  n(),0,0,   n(),p(),p(),  n(),0,0,

       n(),p(),p(),  0,p(),0,   p(),p(),n(),  0,p(),0,   n(),p(),n(),  0,p(),0,
       n(),p(),p(),  0,p(),0,   p(),p(),n(),  0,p(),0,   p(),p(),p(),  0,p(),0,

       n(),p(),n(),  0,0,n(),   p(),n(),n(),  0,0,n(),   p(),p(),n(),  0,0,n(),
       

      ];

      this.vertex_size = 6;

      this.vertex_attributes = {
        a_pos: { size: 3, position: 0 },
        a_nor: { size: 3, position: 3 },
      };

      this.shapes = [
        {vertices: make_mess()},
      ];

      this.vertex_shader = `#version 300 es
      uniform mat4 u_mf, u_mi;
      in vec3 a_pos, a_nor;
      out vec3 v_pos, v_nor;

      void main(){
        vec4 pos = u_mf * vec4(a_pos, 1.);
        vec4 nor = vec4(a_nor, 0.) * u_mi;
        v_pos = pos.xyz / pos.w;
        v_pos.z *= -1.;
        v_nor = nor.xyz;
        gl_Position = vec4(v_pos, 1.);
      }`;

      this.fragment_shader = `#version 300 es
      precision highp float;

      in  vec3 v_pos, v_nor;
      out vec4 frag_col;

      uniform float u_time; 

      void main() {
      vec3 nor = normalize(v_nor);
      float a = .5 * dot(nor,vec3(-.7));
      float d = .5 + max(0.,a) + max(0.,-a);

      float scale = 0.8;

      float col = scale + scale * noise(v_nor); 
      
      frag_col = vec4(vec3(col),1.);
      }`;

      //define variables:
      let start_time = Date.now() / 1000;
      let m = new Matrix();

      //update function:
      this.update = () => {
        let t = Date.now() / 1000 - start_time;
        //   console.log(t % 1);
        set_uniform("1f", "u_time", t);

        m.identity(); 
        m.perspective(100); 
        m.scale(0.6); 
        m.rotate_x(t); 
        m.rotate_y(0.5); 

        set_uniform("Matrix4fv", "u_mf", false, m.get());
        m.inverse();
        set_uniform("Matrix4fv", "u_mi", false, m.get());
      };
    }

    gl_start(canvas, new Scene());
  </script>
