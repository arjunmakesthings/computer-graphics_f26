<!-- whole canvas with just light:  -->

<body bgcolor="black">
  <canvas id="canvas" width="800" height="800"></canvas>
  <script src="./assets/webgl.js"></script>
  <script>
    function Scene() {
      this.vertex_shader = `#version 300 es
         in  vec3 a_pos;
         out vec3 v_pos;
         void main() {
            gl_Position = vec4(a_pos, 1.);
            v_pos = a_pos;
         }`;

      this.fragment_shader = `#version 300 es
         precision highp float;
         in  vec3 v_pos;
         out vec4 frag_col;

         uniform float u_time; 
         void main() {
           float d = sqrt(1. - dot(v_pos, v_pos));
           float rad = 0.5; 
           frag_col = vec4(vec3(1.0), 1.0);

           vec3 pos = v_pos; 
           vec3 light_anchor = vec3(sin(u_time), 1.0, 0.0); 

           if (d>rad){
            float r = .2 + .4 * dot(light_anchor,pos); 
            frag_col = vec4(r, 0.0, 0.0,1.0);  
           }
         }`;

      let start_time = Date.now() / 1000;

      this.update = () => {
        let t = Date.now() / 1000 - start_time;
        //   console.log(t % 1);
        set_uniform("1f", "u_time", t);
      };
    }
    gl_start(canvas, new Scene());
  </script>
</body>
