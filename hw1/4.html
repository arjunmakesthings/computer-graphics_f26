<!-- moving lights in canvas:  -->

<body bgcolor="black">
  <canvas id="canvas" width="800" height="800"></canvas>
  <script src="../assets/webgl.js"></script>
  <script>
    function Scene() {
      this.vertex_shader = `#version 300 es
         in  vec3 a_pos;
         out vec3 v_pos;
         void main() {
            gl_Position = vec4(a_pos, 1.);
            v_pos = a_pos;
         }`;

      this.fragment_shader = `#version 300 es
         precision highp float;
         in  vec3 v_pos;
         out vec4 frag_col;

         uniform float u_time; 
         void main() {
           vec3 pos = v_pos;
          //  float t = 0.;
          float t = u_time;

           //lissajous: 
           float d = 0.1; 

           float x = 0.5 + 0.5 * cos(t); 
           float y = 0.5 + 0.5 * sin(t); 

           vec3 r_pos = vec3(x * d, y * d, 0.0); 
           vec3 g_pos = vec3(x - 1. * d,y+1. * d, 0.0);
           vec3 b_pos = vec3(x+1. * d, y-1. * d, 0.0); 

           float upper = 0.1; 

           float r = max(upper, dot(pos, r_pos));  
           float g = max(upper, dot(pos, g_pos));  
           float b = max(upper, dot(pos, b_pos));  
          float circ_d = sqrt(1. - dot(pos, pos))* ((0.5 + 0.5 * sin(t))); 

          float rad = circ_d * mix(2.0, 4.0, sin(t));
          float rad2 = circ_d * mix(4.0, 8.0, sin(t -1.0));
          float rad3 = circ_d; 

          frag_col = vec4(
          smoothstep(0.8, 8.0, r * rad),
          smoothstep(0.8, 8.0, g * rad),
          smoothstep(0.0005, 1000.0, b * rad),
          1.0
      );
         }`;

      let start_time = Date.now() / 1000;

      this.update = () => {
        let t = Date.now() / 1000 - start_time;
        //   console.log(t % 1);
        set_uniform("1f", "u_time", t);
      };
    }
    gl_start(canvas, new Scene());
  </script>
</body>
