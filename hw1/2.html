<!-- moving triangle in canvas:  -->

<body bgcolor="black">
  <canvas id="canvas" width="800" height="800"></canvas>
  <script src="../assets/webgl.js"></script>
  <script>
    function Scene() {
      this.vertex_shader = `#version 300 es
         in  vec3 a_pos;
         out vec3 v_pos;
         void main() {
            gl_Position = vec4(a_pos, 1.);
            v_pos = a_pos;
         }`;

      this.fragment_shader = `#version 300 es
         precision highp float;
         in  vec3 v_pos;
         out vec4 frag_col;

         uniform float u_time; 
         void main() {
           vec3 pos = v_pos;
           float t = u_time * 0.75;

           //lissajous: 
           float d = 0.5; 
           vec3 rl_pos = vec3(cos(t - 1.) * d, sin(t + 1.) * d, 0.0); 

            float r = dot(pos, rl_pos); 

           //without hard edge:
          //  frag_col = vec4(vec3(max(0.05, r)), 1.0); 

           if (r>0.18){
            frag_col = vec4(vec3(r), 1.0); 
           }
         }`;

      let start_time = Date.now() / 1000;

      this.update = () => {
        let t = Date.now() / 1000 - start_time;
        //   console.log(t % 1);
        set_uniform("1f", "u_time", t);
      };
    }
    gl_start(canvas, new Scene());
  </script>
</body>
