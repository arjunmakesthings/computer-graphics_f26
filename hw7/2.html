      this.vertex_shader = `#version 300 es
      uniform mat4 u_mf, u_mi;
      in vec3 a_pos, a_nor;
      out vec3 v_pos, v_nor;

      void main(){
        vec4 pos = u_mf * vec4(a_pos, 1.);
        vec4 nor = vec4(a_nor, 0.) * u_mi;
        v_pos = pos.xyz / pos.w;
        v_pos.z *= -1.;
        v_nor = nor.xyz;
        gl_Position = vec4(v_pos, 1.);
      }`;

      this.fragment_shader = `#version 300 es
      precision highp float;

      in  vec3 v_pos, v_nor;
      out vec4 frag_col;

      uniform vec3 u_amb, u_diff; 

      uniform vec4 u_spec; 

      uniform float u_time; 

      void main() {
        vec3 l_dir = normalize(vec3(0., 1., 1.)); 
        //vec3 l_dir = normalize(vec3(v_pos)); 
        //vec3 l_dir = normalize(vec3(v_pos)); 
        vec3 n = normalize(v_nor); 

        vec3 v = vec3(0., 0., 1.); 

        float sim = dot (n, l_dir); 
        vec3 ref = 2. * dot(n, l_dir) * n - l_dir; 

        vec3 light = u_amb + u_diff * max (0., sim) + u_spec.rgb * pow(max(0., dot(ref, v)), u_spec.w); 

        float freq  = 23.; //size; bigger: smaller.
        float speed = .3; //speed.
        float amp   = 1.; //strength.

        float ns = noise(v_pos * freq + vec3(0., u_time * speed, 0.));

        //float ns = noise(v_pos + (mod(u_time, 10.) * 0.1)); 

        light += ns; 

        frag_col = vec4(sqrt(light), 1.); 
      }`;

        set_uniform("1f", "u_time", t);

        m.identity();
        m.perspective(10);

        let s = Math.sin(t); 
        let c = Math.cos(t);

        m.move(0., -1. + bl + (bl * 0.2) ,0.); 

        const ceil = 0.1; 
        m.rotate_x(Math.PI / ceil + ceil * s)
        m.rotate_y(Math.PI / ceil + ceil * c)

          if (max_depth < 0) return;

              m.move(0., l, 0.); //move to the center of this branch.

        };
