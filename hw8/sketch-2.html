<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>sketch</title>
  </head>
  <body bgcolor="black">
    <!--<canvas id="canvas" width="800" height="800"></canvas>-->
    <canvas id="canvas"></canvas>

    <!-- for debug: -->
    <style>
      canvas {
        border: 1px solid white;
        margin: 0;
        padding: 0;
        width: 99vw;
        height: 99vh;
        overflow: hidden;
      }
    </style>

    <!-- scripts: -->
    <script src="../assets/webgl-3.1.js"></script>
    <script src="../assets/library-1.3.js"></script>
    <script src="../assets/shapes.js"></script>
    <script src="../assets/materials.js"></script>
    <script src="../assets/noise.js"></script>

    <!-- webgl: -->
    <script>
      let checker = true;
      function Scene() {

        //to make a scene now, we simply define a vertex map (where each thing is, and its size):
        this.vertex_size = 6;
        this.vertex_attributes = {
          a_pos: { size: 3, position: 0 },
          a_nor: { size: 3, position: 3 },
        };

        this.vertex_shader = `#version 300 es
        uniform mat4 u_mf, u_mi;
        in vec3 a_pos, a_nor;
        out vec3 v_pos, v_nor;

        void main(){
          vec4 pos = u_mf * vec4(a_pos, 1.);
          vec4 nor = vec4(a_nor, 0.) * u_mi;
          v_pos = pos.xyz / pos.w;
          v_pos.z *= -1.;
          v_nor = nor.xyz;
          gl_Position = vec4(v_pos, 1.);
        }`;

        this.fragment_shader = `#version 300 es
        precision highp float;

        in  vec3 v_pos, v_nor;
        out vec4 frag_col;

        uniform vec3 u_amb, u_diff;

        uniform vec4 u_spec;

        uniform float u_time;

        void main() {
        vec3 l_dir = normalize(vec3(-1., -1., 1.));
        vec3 n = normalize(v_nor);

        vec3 v = vec3(0., 0., 1.);

        float sim = dot (n, l_dir);
        vec3 ref = 2. * dot(n, l_dir) * n - l_dir;

        vec3 light = u_amb + u_diff * max (0., sim) + u_spec.rgb * pow(max(0., dot(ref, v)), u_spec.w);

        frag_col = vec4(sqrt(light), 1.);
        }`;

        //define variables:
        let start_time = Date.now() / 1000;
        let m = new Matrix();

        //define shapes to be used:
        let shp = make_sphere(20);

        //limb thickness:
        const h = 0.03;
        const d = h;

        this.update = () => {
          //resize to active canvas:
          canvas.width = canvas.clientWidth;
          canvas.height = canvas.clientHeight;
          gl.viewport(0, 0, canvas.width, canvas.height);

          let t = Date.now() / 1000 - start_time;
          set_uniform("1f", "u_time", t);

          //global transforms:
          m.identity();
          m.scale(canvas.height / canvas.width, 1, 1);
          //isometric rotation:
          m.rotate_x(Math.atan(1 / Math.sqrt(2)));
          m.rotate_y(Math.PI  / 4);
          m.perspective(45);

          //length of first limb (shoulder to elbow):
          let a = 0.2;
          //length of second limb (elbow to wrist):
          let b = 0.2;
          //direction the elbow should bend toward.
          //this is a direction, not a position, so it doesn't need converting.
          let D = [0, 1, 0];

          // ---------------------------------------------------------
          // step 1: where things are in the world.
          // ---------------------------------------------------------

          //shoulder position, in world space.
          //the wrist must stay within a + b of this, or the arm can't reach it.
          let shoulder_x = 0.4;
          let shoulder_y = 0.0;
          let shoulder_z = 0.0;

          //wrist position, in world space:
          let wrist_x = map(Math.cos(t), -1, 1, 0.5, 0.8);
          let wrist_y = map(Math.sin(t), -1, 1, -0.2, 0.2);
          let wrist_z = 0.0;

          // ---------------------------------------------------------
          // step 2: ik assumes the shoulder is at the origin (0,0,0).
          // so we describe the wrist *relative to the shoulder*,
          // by subtracting the shoulder position from the wrist position.
          // ---------------------------------------------------------

          let wrist_from_shoulder_x = wrist_x - shoulder_x;
          let wrist_from_shoulder_y = wrist_y - shoulder_y;
          let wrist_from_shoulder_z = wrist_z - shoulder_z;

          let C = [wrist_from_shoulder_x, wrist_from_shoulder_y, wrist_from_shoulder_z];

          // ---------------------------------------------------------
          // step 3: run ik. the elbow it gives back is also
          // relative to the shoulder (shoulder space).
          // ---------------------------------------------------------

          let elbow_from_shoulder = ik(a, b, C, D);

          // ---------------------------------------------------------
          // step 4: turn the elbow back into a world position,
          // by adding the shoulder position back on.
          // ---------------------------------------------------------

          let elbow_x = shoulder_x + elbow_from_shoulder[0];
          let elbow_y = shoulder_y + elbow_from_shoulder[1];
          let elbow_z = shoulder_z + elbow_from_shoulder[2];

          // ---------------------------------------------------------
          // step 5: draw the upper arm, from the shoulder to the elbow.
          // ---------------------------------------------------------

          //angle the upper arm points at, measured in the xy plane:
          let upper_arm_angle = Math.atan2(elbow_y - shoulder_y, elbow_x - shoulder_x);

          m.push();
            //go to the shoulder:
            m.move(shoulder_x, shoulder_y, shoulder_z);
            //turn so that the x axis points at the elbow:
            m.rotate_z(upper_arm_angle);
            //walk halfway along the limb, to its center:
            m.move(a / 2, 0, 0);
            //stretch the unit sphere so it is a long and h thick:
            m.scale(a / 2, h, d);
            draw(shp, Material.red_plastic, m);
          m.pop();

          // ---------------------------------------------------------
          // step 6: draw the forearm, from the elbow to the wrist.
          // ---------------------------------------------------------

          //angle the forearm points at, measured in the xy plane:
          let forearm_angle = Math.atan2(wrist_y - elbow_y, wrist_x - elbow_x);

          m.push();
            //go to the elbow:
            m.move(elbow_x, elbow_y, elbow_z);
            //turn so that the x axis points at the wrist:
            m.rotate_z(forearm_angle);
            //walk halfway along the limb, to its center:
            m.move(b / 2, 0, 0);
            //stretch the unit sphere so it is b long and h thick:
            m.scale(b / 2, h, d);
            draw(shp, Material.blue_plastic, m);
          m.pop();
        };
      }

      gl_start(canvas, new Scene());

      //since i have frag in a different file:

      //  gl_start(canvas, scene);
      //});

    </script>

  </body>
